<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout — Beau L'adresses</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav class="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="nav-logo">Beau <span>L'adresses</span></a>
    <a href="index.html" class="btn btn-outline" style="font-size:.85rem;">← Back to Shop</a>
  </div>
</nav>

<div class="checkout-wrap">
  <h1>Checkout</h1>
  <p style="color:#888;margin-bottom:28px;">Almost there! Complete your order below.</p>

  <div class="order-summary-box">
    <h3>Order Summary</h3>
    <div id="checkoutItems"></div>
    <div class="order-total-line">
      <span>Total</span>
      <span id="checkoutTotal"></span>
    </div>
  </div>

  <form id="checkoutForm" onsubmit="handleCheckout(event)">
    <h3 style="font-size:1rem;font-weight:700;margin-bottom:16px;">Delivery Details</h3>
    <div class="form-group">
      <label>Full Name *</label>
      <input type="text" name="name" required placeholder="Your full name"/>
    </div>
    <div class="form-group">
      <label>Email Address *</label>
      <input type="email" name="email" required placeholder="you@email.com"/>
    </div>
    <div class="form-group">
      <label>Phone Number *</label>
      <input type="tel" name="phone" required placeholder="+91 98765 43210"/>
    </div>
    <div class="form-group">
      <label>Delivery Address *</label>
      <input type="text" name="address" required placeholder="House/Street, Area"/>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="form-group">
        <label>City *</label>
        <input type="text" name="city" required placeholder="City"/>
      </div>
      <div class="form-group">
        <label>PIN Code *</label>
        <input type="text" name="pin" required placeholder="400001"/>
      </div>
    </div>
    <div class="form-group">
      <label>State *</label>
      <input type="text" name="state" required placeholder="Maharashtra"/>
    </div>
    <div class="form-group" style="margin-top:24px;">
      <label>Payment Method</label>
      <select name="payment">
        <option value="cod">Cash on Delivery</option>
        <option value="upi">UPI / QR Code</option>
        <option value="card">Credit / Debit Card</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;padding:16px;font-size:1.05rem;border-radius:50px;margin-top:8px;">
      Place Order →
    </button>
  </form>
</div>

<!-- Order Confirmation Modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-box" style="grid-template-columns:1fr;max-width:480px;text-align:center;padding:48px 40px;border-radius:20px;">
    <div style="font-size:3rem;margin-bottom:16px;">🎉</div>
    <h2 style="font-size:1.6rem;font-weight:800;margin-bottom:8px;">Order Placed!</h2>
    <p style="color:#888;margin-bottom:8px;">Your order has been confirmed.</p>
    <p id="confirmOrderId" style="font-weight:700;color:#0d0d0d;margin-bottom:24px;"></p>
    <a href="index.html" class="btn btn-primary" style="margin:0 auto;">Continue Shopping →</a>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/data.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const cart = getCart();
    const db = getDB();
    if (!cart.length) { window.location.href = 'index.html'; return; }
    const itemsDiv = document.getElementById('checkoutItems');
    itemsDiv.innerHTML = cart.map(item => {
      const p = db.products.find(x => x.id === item.productId);
      return p ? `<div class="order-line"><span>${p.name} (${item.size}) x${item.qty}</span><span>${formatPrice(p.price * item.qty)}</span></div>` : '';
    }).join('');
    document.getElementById('checkoutTotal').textContent = formatPrice(getCartTotal());
  });

  function handleCheckout(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const info = Object.fromEntries(fd.entries());
    const order = placeOrder(info);
    document.getElementById('confirmOrderId').textContent = 'Order ID: ' + order.id;
    document.getElementById('confirmModal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
</script>
</body>
</html>
